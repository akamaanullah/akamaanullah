<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Amaanullah (AK) - Full-Stack Developer and Product Designer">
<defs>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#fbbf24"/><stop offset=".5" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1400 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset=".55" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f97316" stroke-opacity=".09"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<clipPath id="frame"><rect width="1200" height="440" rx="26"/></clipPath>
<style>.mono{font-family:'Fira Code','JetBrains Mono','SF Mono',Consolas,Menlo,monospace}.sans{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.8s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.cyc{opacity:0;animation:cyc 12s infinite}
.c2{animation-delay:3s}.c3{animation-delay:6s}.c4{animation-delay:9s}
@keyframes cyc{0%{opacity:0;transform:translateY(12px)}3%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-12px)}}
.fl{animation:fl 6s ease-in-out infinite}
.fl2{animation:fl 8s ease-in-out infinite reverse}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="440" fill="#0a0a0f"/>
<rect width="1200" height="440" fill="url(#grid)"/>
<circle cx="260" cy="110" r="150" fill="#f97316" opacity=".32" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;140 70;0 0" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="1010" cy="390" r="170" fill="#dc2626" opacity=".28" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;-120 -60;0 0" dur="13s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="60" r="110" fill="#fbbf24" opacity=".16" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;-80 90;0 0" dur="9s" repeatCount="indefinite"/></circle>
<rect x="0" y="0" width="1200" height="3" fill="#f97316" opacity=".18"><animate attributeName="y" values="0;440" dur="5s" repeatCount="indefinite"/></rect>

<g class="rise d1">
<rect x="70" y="58" width="262" height="34" rx="17" fill="#f97316" fill-opacity=".12" stroke="#f97316" stroke-opacity=".5"/>
<circle cx="93" cy="75" r="5" fill="#22c55e"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="110" y="80" class="mono" font-size="13" fill="#fdba74" letter-spacing="2">AVAILABLE FOR PROJECTS</text>
</g>

<text x="70" y="188" class="sans rise d2" font-size="108" font-weight="900" fill="url(#shine)" textLength="690" lengthAdjust="spacingAndGlyphs">AMAANULLAH</text>
<text x="70" y="242" class="sans rise d3" font-size="21" font-weight="600" fill="#e7e5e4" letter-spacing="5" textLength="690" lengthAdjust="spacing">FULL-STACK DEVELOPER  •  PRODUCT DESIGNER</text>
<text x="70" y="318" class="mono cyc c1" font-size="25" fill="#fdba74"><tspan fill="#f97316">&gt; </tspan>Laravel • MySQL • REST APIs</text><text x="70" y="318" class="mono cyc c2" font-size="25" fill="#fdba74"><tspan fill="#f97316">&gt; </tspan>Flutter • Firebase Realtime</text><text x="70" y="318" class="mono cyc c3" font-size="25" fill="#fdba74"><tspan fill="#f97316">&gt; </tspan>Dashboards • CRMs • SaaS platforms</text><text x="70" y="318" class="mono cyc c4" font-size="25" fill="#fdba74"><tspan fill="#f97316">&gt; </tspan>Wireframe → Prototype → Production</text>
<g class="rise d4"><rect x="70" y="352" width="104" height="34" rx="17" fill="#f97316" fill-opacity=".1" stroke="#f97316" stroke-opacity=".45"/><text x="122.0" y="374" text-anchor="middle" class="mono" font-size="13" fill="#fdba74" letter-spacing="1.5">LARAVEL</text></g><g class="rise d4"><rect x="186" y="352" width="104" height="34" rx="17" fill="#f97316" fill-opacity=".1" stroke="#f97316" stroke-opacity=".45"/><text x="238.0" y="374" text-anchor="middle" class="mono" font-size="13" fill="#fdba74" letter-spacing="1.5">FLUTTER</text></g><g class="rise d4"><rect x="302" y="352" width="114" height="34" rx="17" fill="#f97316" fill-opacity=".1" stroke="#f97316" stroke-opacity=".45"/><text x="359.0" y="374" text-anchor="middle" class="mono" font-size="13" fill="#fdba74" letter-spacing="1.5">FIREBASE</text></g><g class="rise d4"><rect x="428" y="352" width="84" height="34" rx="17" fill="#f97316" fill-opacity=".1" stroke="#f97316" stroke-opacity=".45"/><text x="470.0" y="374" text-anchor="middle" class="mono" font-size="13" fill="#fdba74" letter-spacing="1.5">MYSQL</text></g><g class="rise d4"><rect x="524" y="352" width="84" height="34" rx="17" fill="#f97316" fill-opacity=".1" stroke="#f97316" stroke-opacity=".45"/><text x="566.0" y="374" text-anchor="middle" class="mono" font-size="13" fill="#fdba74" letter-spacing="1.5">FIGMA</text></g>

<g>
<circle cx="1000" cy="220" r="132" fill="none" stroke="#f97316" stroke-opacity=".55" stroke-width="2" stroke-dasharray="4 14" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 1000 220" to="360 1000 220" dur="24s" repeatCount="indefinite"/></circle>
<circle cx="1000" cy="220" r="102" fill="none" stroke="#fbbf24" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="30 12"><animateTransform attributeName="transform" type="rotate" from="360 1000 220" to="0 1000 220" dur="18s" repeatCount="indefinite"/></circle>
<polygon points="1062.4,256.0 1000.0,292.0 937.6,256.0 937.6,184.0 1000.0,148.0 1062.4,184.0" fill="#f97316" fill-opacity=".1" stroke="url(#og)" stroke-width="3"/>
<text x="1000" y="241" text-anchor="middle" class="sans" font-size="62" font-weight="900" fill="url(#og)">AK</text>
<g><circle cx="1132" cy="220" r="7" fill="#fbbf24"/><animateTransform attributeName="transform" type="rotate" from="0 1000 220" to="360 1000 220" dur="8s" repeatCount="indefinite"/></g>
</g>

<text x="840" y="92" class="mono fl" font-size="34" fill="#f97316" fill-opacity=".35">{ }</text>
<text x="1090" y="360" class="mono fl2" font-size="34" fill="#fbbf24" fill-opacity=".3">&lt;/&gt;</text>
<text x="860" y="390" class="mono fl" font-size="26" fill="#ea580c" fill-opacity=".35">$_</text>

<rect y="434" width="1200" height="6" fill="url(#shine)"/>
</g>
<rect x="1" y="1" width="1198" height="438" rx="25" fill="none" stroke="#f97316" stroke-opacity=".4" stroke-width="2"/>
</svg>