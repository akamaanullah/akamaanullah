<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
<clipPath id="cp"><rect x="1" y="1" width="998" height="90" rx="18"/></clipPath>
<style>.mono{font-family:'Fira Code','JetBrains Mono','SF Mono',Consolas,Menlo,monospace}.sans{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}</style>
</defs>
<rect x="1" y="1" width="998" height="90" rx="18" fill="#0a0a0f" stroke="#f97316" stroke-opacity=".35" stroke-width="2"/>
